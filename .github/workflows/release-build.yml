name: Build & Publish Desktop Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish assets to (e.g. v0.1.0)'
        required: true
        default: v0.1.0
  push:
    tags:
      - 'v0.1.0'

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: AEGIS.dmg
            label: macos
          - os: windows-latest
            artifact: AEGIS.exe
            label: windows
          - os: ubuntu-latest
            artifact: AEGIS.AppImage
            label: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm install

      - name: Build server + web
        run: npm run build

      - name: Build SEA bundle
        run: npm run build:sea

      - name: Build native binary (pkg)
        run: npx pkg .

      # ------------------------------------------------------------------
      # Windows — rename the pkg binary
      # ------------------------------------------------------------------
      - name: Prepare Windows EXE
        if: matrix.os == 'windows-latest'
        run: |
          Copy-Item dist\pkg\*-win.exe dist\AEGIS.exe

      # ------------------------------------------------------------------
      # macOS — build a PROPER .app bundle with Info.plist
      # ------------------------------------------------------------------
      - name: Prepare macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          APP="dist/AEGIS.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          # Copy the binary
          cp dist/pkg/*-macos "$APP/Contents/MacOS/AEGIS"
          chmod +x "$APP/Contents/MacOS/AEGIS"

          # Copy the icon (convert svg to icns if possible, else use png)
          cp web/public/icon.svg "$APP/Contents/Resources/AppIcon.svg"

          # Write a proper Info.plist
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>AEGIS</string>
            <key>CFBundleDisplayName</key>
            <string>AEGIS</string>
            <key>CFBundleIdentifier</key>
            <string>com.aegis.rtq-command-deck</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>AEGIS</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSRequiresAquaSystemAppearance</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # Create the DMG
          hdiutil create -volname "AEGIS" -srcfolder dist/AEGIS.app \
            -ov -format UDZO dist/AEGIS.dmg

      # ------------------------------------------------------------------
      # Linux — wrap the binary in a REAL AppImage (appimagetool)
      # ------------------------------------------------------------------
      - name: Prepare Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p dist/AppDir/usr/bin
          mkdir -p dist/AppDir/usr/share/icons/hicolor/scalable/apps
          cp dist/pkg/*-linux dist/AppDir/usr/bin/AEGIS
          chmod +x dist/AppDir/usr/bin/AEGIS
          cp web/public/icon.svg dist/AppDir/usr/share/icons/hicolor/scalable/apps/AEGIS.svg
          cp web/public/icon.svg dist/AppDir/AEGIS.svg
          cat > dist/AppDir/AEGIS.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AEGIS
          Exec=AEGIS
          Icon=AEGIS
          Categories=Utility;
          EOF
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O dist/appimagetool
          chmod +x dist/appimagetool
          dist/appimagetool dist/AppDir dist/AEGIS.AppImage
          rm -rf dist/AppDir dist/appimagetool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-artifact
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve target tag
        id: tag
        run: |
          TAG="${RELEASE_TAG:-v0.1.0}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/AEGIS.dmg release-assets/AEGIS.exe release-assets/AEGIS.AppImage --clobber
          else
            gh release create "$TAG" release-assets/AEGIS.dmg release-assets/AEGIS.exe release-assets/AEGIS.AppImage --generate-notes
          fi
